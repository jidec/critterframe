[project]
name = "critterframe"
version = "0.1.0"
description = "Images to traits: segment organisms out of images and measure them, reproducibly"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "opencv-python",
    "lmdb",
    "pycocotools",
    "requests",
    "scikit-learn",
    "python-dotenv",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
# Segmentation models. Kept optional because the core pipeline -- ingest,
# storage, transforms, metrics, export, validation -- runs without torch, and a
# project segmenting with its own model shouldn't be made to install SAM2.
segmentation = [
    "torch",
    "transformers",
    "pillow",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["critterframe*"]
