site_name: critterframe
site_description: "Image frames of critters into dataframes of traits"
site_url: https://jidec.github.io/critterframe/
repo_url: https://github.com/jidec/critterframe
repo_name: jidec/critterframe
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_submodules: true
            show_root_heading: true
            show_source: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            docstring_section_style: list

# Ordered to match the package layout in README.md, so the tree a reader sees
# there and the nav they browse here are the same list in the same order.
nav:
  - Home: index.md
  - API Reference:
      - recipes: api/recipes.md
      - ingest: api/ingest.md
      - download: api/download.md
      - export: api/export.md
      - selectionhelpers: api/selectionhelpers.md
      - project: api/project.md
      - storage: api/storage.md
      - records:
          - occurrences: api/records/occurrences.md
          - masks: api/records/masks.md
          - runs: api/records/runs.md
          - metrics: api/records/metrics.md
          - calibrations: api/records/calibrations.md
          - models: api/records/models.md
      - segmentation: api/segmentation.md
      - transforms: api/transforms.md
      - metrics: api/metrics.md
      - calibrations: api/calibrations.md
      - validation: api/validation.md
      - visualization: api/visualization.md
      - training: api/training.md
      - extensions: api/extensions.md
